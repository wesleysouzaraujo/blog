<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<title>Redirecionando...</title>
<style>
  body { font-family: Inter, Arial, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#F8F9FA; }
  .box { text-align:center; }
  .spinner { width:36px; height:36px; border:4px solid #eee; border-top-color:#E63946; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" aria-hidden="true"></div>
    <p>Redirecionando para o Mercado Livre...</p>
    <p><a id="fallback-link" href="/">Clique aqui se não for redirecionado automaticamente</a></p>
  </div>

<script>
/**
 * Redirecionador central de links de afiliado.
 *
 * Uso nos artigos (SEMPRE com rel="sponsored noopener" — obrigatório pelo
 * Google para links de afiliado/pagos desde 2019, não é só "nofollow"):
 *   <a href="/go/?p=creatina-growth" rel="sponsored noopener" target="_blank">Ver na Mercado Livre</a>
 *
 * Vantagens:
 *  - Um único lugar para trocar/atualizar o link de cada produto
 *    (não precisa editar N páginas de artigo)
 *  - Permite registrar clique (analytics) antes de sair do site
 *  - Se o produto sair de linha, você troca só aqui, sem quebrar o artigo
 *  - Fallback inteligente: se o slug não existir, manda para sua página
 *    geral de recomendações no Mercado Livre em vez de dar erro
 *
 * COMO GERAR O LINK DE CADA PRODUTO (importante):
 *  O Mercado Livre exige um link de afiliado ESPECÍFICO por produto — o link
 *  do seu perfil/recomendações NÃO rastreia vendas de produtos individuais.
 *  1. Abra o produto no app ou site do Mercado Livre já logado na sua conta
 *     de afiliado.
 *  2. Toque em "Compartilhar" / use a ferramenta de afiliados para gerar o
 *     link daquele anúncio específico (algo como https://mercadolivre.com/sec/xxxxxxx
 *     ou uma URL com parâmetros matt_word/matt_tool já embutidos).
 *  3. Cole a URL completa (já pronta, sem editar) no mapeamento PRODUCTS abaixo.
 *  NÃO concatene tags manualmente — o link gerado pelo ML já vem completo
 *  com seu rastreamento; editar a URL pode quebrar a atribuição da comissão.
 */

// Link geral de recomendações (usado como fallback quando o slug não é
// encontrado — melhor do que mandar a pessoa de volta pro blog).
var FALLBACK_URL = 'https://meli.la/2WGH3Hb';

// Mapeamento slug -> link de afiliado JÁ PRONTO (gerado pelo ML para aquele
// produto específico). Troque os valores de exemplo abaixo pelos seus links reais.
var PRODUCTS = {
  // 'creatina-growth': 'https://mercadolivre.com/sec/COLE_SEU_LINK_AQUI',
  // 'whey-optimum-gold': 'https://mercadolivre.com/sec/COLE_SEU_LINK_AQUI',
  // 'pre-treino-c4': 'https://mercadolivre.com/sec/COLE_SEU_LINK_AQUI'
};

function getParam(name) {
  var params = new URLSearchParams(window.location.search);
  return params.get(name);
}

(function redirect() {
  var slug = getParam('p');
  var destination = (slug && PRODUCTS[slug]) || FALLBACK_URL;
  var isFallback = !(slug && PRODUCTS[slug]);

  var fallback = document.getElementById('fallback-link');
  fallback.href = destination;

  // Ponto de extensão: registrar o clique antes de redirecionar.
  // Exemplo com Google Analytics 4 (gtag), se estiver configurado no site:
  if (typeof gtag === 'function') {
    gtag('event', 'affiliate_click', {
      product_slug: slug || '(vazio)',
      destination: destination,
      used_fallback: isFallback
    });
  }

  window.location.replace(destination);
})();
</script>
</body>
</html>
